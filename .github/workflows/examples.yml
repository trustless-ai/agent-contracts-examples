name: examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  forge:
    name: forge test (all examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Discover and run every example suite
        run: ./scripts/run-examples.sh
